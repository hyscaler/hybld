<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" width="360" height="360" role="img" aria-label="">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#0f8a5f"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- The site: a calm grid of already-built pages. -->
  <g stroke="#7e9689" stroke-opacity="0.45" fill="#7e9689" fill-opacity="0.08">
    <rect x="30"  y="30"  width="60" height="60" rx="12"/>
    <rect x="110" y="30"  width="60" height="60" rx="12"/>
    <rect x="190" y="30"  width="60" height="60" rx="12"/>
    <rect x="270" y="30"  width="60" height="60" rx="12"/>
    <rect x="30"  y="110" width="60" height="60" rx="12"/>
    <rect x="110" y="110" width="60" height="60" rx="12"/>
    <rect x="270" y="110" width="60" height="60" rx="12"/>
    <rect x="30"  y="190" width="60" height="60" rx="12"/>
    <rect x="110" y="190" width="60" height="60" rx="12"/>
    <rect x="190" y="190" width="60" height="60" rx="12"/>
    <rect x="270" y="190" width="60" height="60" rx="12"/>
    <rect x="30"  y="270" width="60" height="60" rx="12"/>
    <rect x="190" y="270" width="60" height="60" rx="12"/>
    <rect x="270" y="270" width="60" height="60" rx="12"/>
  </g>

  <!-- The one page that changed: rebuilt, glowing, carrying the hybld mark. -->
  <rect x="190" y="110" width="60" height="60" rx="12" fill="url(#tile)" filter="url(#glow)"/>
  <rect x="205" y="124" width="29" height="8.6" rx="4.3" fill="#06231a" opacity="0.38"/>
  <rect x="205" y="147" width="29" height="8.6" rx="4.3" fill="#06231a" opacity="0.38"/>
  <rect x="209.5" y="135.5" width="29" height="8.6" rx="4.3" fill="#f4faf7"/>

  <!-- Its dependent listing page, refreshed alongside. -->
  <rect x="110" y="270" width="60" height="60" rx="12" fill="#10b981" fill-opacity="0.28" stroke="#34d399" stroke-opacity="0.9" stroke-width="2"/>
  <g stroke="#34d399" stroke-opacity="0.9" stroke-width="4" stroke-linecap="round">
    <line x1="124" y1="292" x2="156" y2="292"/>
    <line x1="124" y1="304" x2="148" y2="304"/>
  </g>

  <!-- The dependency edge. -->
  <path d="M218 172 C 210 220, 175 240, 152 268" fill="none" stroke="#34d399" stroke-width="2.5" stroke-dasharray="2 7" stroke-linecap="round" opacity="0.85"/>
</svg>
